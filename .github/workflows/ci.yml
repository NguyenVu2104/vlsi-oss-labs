
name: RTL CI

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint and simulate
        run: bash ./scripts/ci.sh
